<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Admin - Barbearia</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="admin-header">
  <div>
    <span class="admin-tag">Painel administrativo</span>
    <h1>Controle da Barbearia</h1>
  </div>

  <button id="logoutBtn" class="logout-btn">
    Sair
  </button>
</header>

<main class="admin-container">

  <section class="admin-login-card" id="loginSection">

    <span class="tag">Login admin</span>

    <h2>Acesso restrito</h2>

    <div class="admin-login-grid">

      <div class="field">
        <label>Usuário</label>
        <input type="text" id="adminUser" placeholder="Digite o usuário">
      </div>

      <div class="field">
        <label>Senha</label>
        <input type="password" id="adminPassword" placeholder="Digite a senha">
      </div>

    </div>

    <button id="loginBtn" class="submit-btn">
      Entrar no painel
    </button>

    <p id="loginMessage"></p>

  </section>

  <section class="dashboard" id="dashboardSection">

    <div class="dashboard-grid">

      <div class="dashboard-card">
        <span>Total de agendamentos</span>
        <strong id="appointmentsCount">0</strong>
      </div>

      <div class="dashboard-card">
        <span>Total de bloqueios</span>
        <strong id="blocksCount">0</strong>
      </div>

    </div>

    <section class="admin-block-section">

      <div class="admin-block-header">
        <div>
          <span class="tag">Bloquear horários</span>
          <h2>Gerenciar bloqueios</h2>
        </div>
      </div>

      <form id="blockForm" class="admin-form">

        <div class="field">
          <label>Data</label>
          <input type="date" id="blockDate">
        </div>

        <div class="field">
          <label>Horário (opcional)</label>
          <input type="time" id="blockTime">
        </div>

        <div class="field full">
          <label>Motivo</label>
          <input type="text" id="blockReason" placeholder="Ex: Viagem, feriado, manutenção">
        </div>

        <button type="submit" class="submit-btn">
          Criar bloqueio
        </button>

      </form>

    </section>

    <section class="admin-content-grid">

      <div class="admin-panel-card">

        <div class="panel-header">
          <div>
            <span class="tag">Agendamentos</span>
            <h2>Horários marcados</h2>
          </div>
        </div>

        <div id="appointmentsList" class="admin-list"></div>

      </div>

      <div class="admin-panel-card">

        <div class="panel-header">
          <div>
            <span class="tag">Bloqueios</span>
            <h2>Dias e horários bloqueados</h2>
          </div>
        </div>

        <div id="blocksList" class="admin-list"></div>

      </div>

    </section>

  </section>

</main>

<script src="admin.js"></script>
</body>
</html>

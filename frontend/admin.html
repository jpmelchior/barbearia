<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Barbearia Prime</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="admin-container">
    <section class="login-box" id="loginBox">
      <h1>Painel Admin</h1>
      <p>Entre para ver os agendamentos.</p>

      <form id="loginForm">
        <input type="text" id="adminUser" placeholder="Usuário" required />
        <input type="password" id="adminPassword" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>

      <p id="loginMessage" class="message"></p>
    </section>

    <section class="panel hidden" id="adminPanel">
      <header class="panel-header">
        <div>
          <h1>Agendamentos</h1>
          <p>Mostrando 5 por página</p>
        </div>

        <div class="header-actions">
          <button id="refreshBtn">Atualizar</button>
          <button id="logoutBtn" class="logout">Sair</button>
        </div>
      </header>

      <section id="appointmentsList" class="appointments-list"></section>

      <div class="pagination">
        <button id="prevPage">Anterior</button>
        <span id="pageInfo">Página 1</span>
        <button id="nextPage">Próxima</button>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
